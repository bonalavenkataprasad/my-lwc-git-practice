<template>
    <lightning-card title="Scenario 3: Expand Section with Conditional Rendering">

        <!-- Action Button -->
        <div class="slds-m-around_medium">
            <lightning-button
                label={buttonLabel}
                variant="brand"
                onclick={toggleSection}>
            </lightning-button>
        </div>

        <!-- Expanded Section -->
        <template if:true={showSection}>
            <div class="slds-box slds-m-around_medium">
                <p><strong>Account Details</strong></p>
                <p>Account Name: ABC Corp</p>
                <p>Industry: IT Services</p>
                <!--In real applications, sensitive fields like phone numbers are masked or blurred. I have used Test Data-->
                <p>Phone: +91 1234567890</p>
                <p>Billing City: Hyderabad</p>
                <p>Rating: Hot</p>
            </div>
        </template>

        <!-- Collapsed Help Text -->
        <template if:false={showSection}>
            <p class="slds-m-around_medium">
                Click <strong>View More Details</strong> to see additional account information.
            </p>
        </template>

    </lightning-card>
</template>
