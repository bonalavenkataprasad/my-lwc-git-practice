<template>
    <lightning-card title="Scenario 8: Combined Iteration & Conditional UI">

        <div class="slds-m-around_medium">

            <!-- Records exist -->
            <template if:true={hasContacts}>
                <template for:each={contacts} for:item="contact">
                    <div key={contact.id}
                         class={contactClass}
                         data-vip={contact.isVip}>

                        <p><strong>Name:</strong> {contact.name}</p>
                        <p><strong>Email:</strong> {contact.email}</p>
                        <p><strong>Phone:</strong> {contact.phone}</p>

                        <template if:true={contact.isVip}>
                            <p class="slds-text-color_success">
                                ⭐ VIP Contact
                            </p>
                        </template>

                    </div>
                </template>
            </template>

            <!-- Empty State -->
            <template if:false={hasContacts}>
                <p class="slds-text-align_center slds-text-color_weak">
                    No records found.
                </p>
            </template>

        </div>

    </lightning-card>
</template>
